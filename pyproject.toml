[project]
name = "team3-ecommercesystemai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "onnxruntime==1.29.0",
    "pillow>=12.3,<13",
    "prometheus-fastapi-instrumentator>=8.1,<9",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "rembg==2.0.85",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
]
# Fine-tuning data tools (personal learning); OCR uses macOS Vision.
dataset = [
    "ocrmac>=1.0.1,<2; sys_platform == 'darwin'",
]

[project.scripts]
serve-ai = "detail_page_ai.app:run"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
